<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICL India — Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d212a;
    --border: #262b35;
    --text: #eef0f3;
    --text-dim: #8b93a1;
    --accent: #ff8a3d;
    --accent-ink: #26130a;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"] {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --panel-2: #f7f8fa;
    --border: #e1e4e9;
    --text: #1a1d24;
    --text-dim: #6b7280;
    --accent: #e0721c;
    --accent-ink: #fff5ec;
    --shadow: 0 8px 24px rgba(20,20,30,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* ── Header ───────────────────────────── */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 13px;
  }
  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    color: var(--accent-ink);
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1px;
    line-height: 1.3;
  }
  .brand-text p {
    font-size: 11.5px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 1px;
  }

  .right-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  .theme-btn {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .theme-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .theme-btn svg { width: 18px; height: 18px; }
  .theme-btn .sun { display: none; }
  :root[data-theme="light"] .theme-btn .moon { display: none; }
  :root[data-theme="light"] .theme-btn .sun { display: block; }

  /* ── Panel switch (segmented control) ─── */
  nav.switch {
    position: relative;
    display: flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 3px;
    gap: 2px;
  }
  nav.switch .thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    height: calc(100% - 6px);
    width: 0;
    background: var(--accent);
    border-radius: 6px;
    transition: transform 0.25s cubic-bezier(.4,0,.2,1), width 0.25s cubic-bezier(.4,0,.2,1);
  }
  nav.switch button {
    position: relative;
    z-index: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: color 0.2s;
    white-space: nowrap;
  }
  nav.switch button.active { color: var(--accent-ink); }

  /* ── Slide area ───────────────────────── */
  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  .panel {
    position: absolute;
    inset: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .panel.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: var(--panel);
  }
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    background: var(--panel);
  }
  .spinner {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Footer ───────────────────────────── */
  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 8px 26px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  @media (max-width: 640px) {
    header {
      grid-template-columns: 1fr auto;
      grid-template-areas: "brand theme" "switch switch";
      row-gap: 12px;
      padding: 12px 16px;
    }
    .brand { grid-area: brand; }
    .right-controls { grid-area: theme; }
    nav.switch { grid-area: switch; justify-self: stretch; }
    nav.switch button { flex: 1; text-align: center; padding: 8px 10px; font-size: 12px; }
    .brand-text p { display: none; }
    footer { padding: 6px 16px; font-size: 9.5px; }
    .panel { inset: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">P</div>
    <div class="brand-text">
      <h1>PICL India — Operations Dashboard</h1>
    </div>
  </div>

  <nav class="switch" id="switch">
    <div class="thumb"></div>
    <button class="active" onclick="showPanel(0)">Production Performance</button>
    <button onclick="showPanel(1)">Manpower</button>
  </nav>

  <div class="right-controls">
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="stage">
  <div class="panel active" id="panel-0">
    <div class="loading" id="load-0"><div class="spinner"></div><span>Loading production data…</span></div>
    <iframe src="https://piclinnovation.github.io/Production-Performance/" title="Production Performance" onload="document.getElementById('load-0').style.display='none'"></iframe>
  </div>
  <div class="panel" id="panel-1">
    <div class="loading" id="load-1"><div class="spinner"></div><span>Loading manpower data…</span></div>
    <iframe src="https://piclinnovation.github.io/Manpower_Dashboard/" title="Manpower Dashboard" onload="document.getElementById('load-1').style.display='none'"></iframe>
  </div>
</div>

<footer>
  <span>PICL INDIA — PLANT OPERATIONS</span>
  <span id="date"></span>
</footer>

<script>
  function positionThumb() {
    const nav = document.getElementById('switch');
    const activeBtn = nav.querySelector('button.active');
    const thumb = nav.querySelector('.thumb');
    const navRect = nav.getBoundingClientRect();
    const btnRect = activeBtn.getBoundingClientRect();
    thumb.style.width = btnRect.width + 'px';
    thumb.style.transform = `translateX(${btnRect.left - navRect.left - 3}px)`;
  }

  function showPanel(index) {
    document.querySelectorAll('.panel').forEach((el, i) => el.classList.toggle('active', i === index));
    document.querySelectorAll('nav.switch button').forEach((b, i) => b.classList.toggle('active', i === index));
    positionThumb();
  }

  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
  }

  window.addEventListener('load', positionThumb);
  window.addEventListener('resize', positionThumb);

  document.getElementById('date').textContent = new Date().toLocaleDateString('en-IN', {
    weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'
  });
</script>

</body>
</html>
